<!DOCTYPE html>
<!--
  WHS GenAI — Config Drift Actions
  Data-driven page: window.WHS_DRIFT (assets/drift-actions.js, generated by
  export_drift_ui.py from the *_explained.csv). No build step, no network.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WHS GenAI — Config Drift Actions</title>
  <link rel="stylesheet" href="./assets/design-system.css" />
  <style>
    .cda-wrap { max-width: 1180px; }
    .cda-prio-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); margin-bottom: var(--space-5); }
    .cda-prio { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); background: var(--color-surface); }
    .cda-prio__count { font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: -.02em; }
    .cda-prio__label { font-size: var(--fs-xs); color: var(--color-text-mute); margin-top: 2px; }
    .cda-prio--P1 { border-top: 3px solid var(--color-danger); }
    .cda-prio--P2 { border-top: 3px solid var(--color-warning); }
    .cda-prio--P3 { border-top: 3px solid #6B7CFF; }
    .cda-prio--MONITOR { border-top: 3px solid var(--color-success); }
    .cda-prio--IGNORE { border-top: 3px solid var(--color-border); }
    .cda-action { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-3); overflow: hidden; background: var(--color-surface); }
    .cda-action__head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); cursor: pointer; }
    .cda-action__head:hover { background: var(--color-primary-softer); }
    .cda-action__title { font-weight: var(--fw-semibold); font-size: var(--fs-body); }
    .cda-action__meaning { font-size: var(--fs-xs); color: var(--color-text-soft); }
    .cda-action__count { margin-left: auto; font-weight: var(--fw-bold); font-size: var(--fs-h3); }
    .cda-action__body { padding: 0 var(--space-4) var(--space-3); display: none; }
    .cda-action.is-open .cda-action__body { display: block; }
    .cda-pill { display: inline-block; font-size: 10px; font-weight: var(--fw-bold); padding: 2px 7px; border-radius: 999px; letter-spacing: .03em; }
    .cda-pill--P1 { background: #F8E5E1; color: var(--color-danger); }
    .cda-pill--P2 { background: #FBF0E0; color: var(--color-warning); }
    .cda-pill--P3 { background: #EAECFF; color: #3B49B5; }
    .cda-pill--MONITOR { background: #E4F2E9; color: var(--color-success); }
    .cda-pill--IGNORE { background: var(--color-bg-alt); color: var(--color-text-soft); }
    .cda-dev { border-top: 1px dashed var(--color-border); padding: var(--space-3) 0; }
    .cda-dev__key { font-family: var(--font-mono, monospace); font-size: var(--fs-xs); color: var(--color-text); font-weight: var(--fw-semibold); }
    .cda-dev__io { font-family: var(--font-mono, monospace); font-size: var(--fs-xs); margin: 4px 0; }
    .cda-dev__io b { color: var(--color-danger); } .cda-dev__io i { color: var(--color-success); font-style: normal; }
    .cda-ai { font-size: var(--fs-small); background: var(--color-primary-softer); border-left: 3px solid var(--color-primary); padding: 8px 10px; border-radius: 0 6px 6px 0; margin: 6px 0 4px; }
    .cda-cites { font-size: 11px; color: var(--color-text-soft); }
    .cda-cites .tag { font-weight: var(--fw-bold); }
    .cda-explain { font-size: var(--fs-xs); color: var(--color-text-soft); margin-top: 4px; line-height: 1.55; }
    .cda-legend { display: flex; flex-wrap: wrap; gap: var(--space-3); font-size: var(--fs-xs); color: var(--color-text-soft); margin: var(--space-4) 0; }
    .cda-legend .tag { font-weight: var(--fw-bold); }
    .cda-meta { font-size: var(--fs-xs); color: var(--color-text-mute); }
    .cda-siterow { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3); }
    .cda-select { min-width: 320px; max-width: 100%; padding: .5rem .7rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); font-size: var(--fs-body); }
  </style>
</head>
<body class="app-body" data-active="assistants" data-active-id="config-drift-explainer">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="content">
      <div class="content__topbar">
        <a href="assistant.html?id=config-drift-explainer" class="crumb">Config Drift Assistant</a>
        <span class="crumb">/</span>
        <h1>Config Drift — Site Actions</h1>
      </div>

      <div class="content__body dk-compact cda-wrap">

        <div class="cda-siterow">
          <label class="cda-meta" for="cda-site" style="font-weight:var(--fw-bold)">Audited site</label>
          <select id="cda-site" class="cda-select"></select>
          <span class="cda-meta" id="cda-sitecount"></span>
        </div>

        <p class="cda-meta" id="cda-meta"></p>

        <!-- priority rollup -->
        <div class="cda-prio-grid" id="cda-prio"></div>

        <!-- distribution KPIs -->
        <div class="kpi-row" id="cda-kpis" style="margin-bottom:var(--space-5)"></div>

        <!-- grounding legend -->
        <div class="cda-legend">
          <span><span class="tag">Grounding tags:</span></span>
          <span><span class="tag">[MOCA]</span> data model (poldat/aremst)</span>
          <span><span class="tag">[PRIME]</span> Config Drift behaviour</span>
          <span><span class="tag">[CRFC]</span> CFG-RFC register</span>
          <span><span class="tag">[PYTHON]</span> how it was classified</span>
          <span><span class="tag">[GENERAL]</span> domain knowledge</span>
        </div>

        <h3 class="panel-subhead">Action items — grouped by recommended action</h3>
        <div id="cda-actions"></div>

      </div>
    </main>
  </div>

  <script src="./assets/data.js"></script>
  <script src="./assets/drift-actions.js"></script>
  <script>
  (function () {
    var D = window.WHS_DRIFT;
    var root = document.getElementById("cda-actions");
    if (!D || !D.sites || !D.sites.length) {
      root.innerHTML = '<div class="empty-state">No drift data. Run export_drift_ui.py to generate assets/drift-actions.js.</div>';
      return;
    }
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };
    var tagCites = function (s) {
      return esc(s).replace(/\[(MOCA|PRIME|CRFC|PYTHON|GENERAL|DOC|INFERRED)\]/g, '<span class="tag">[$1]</span>');
    };
    var active = 0;

    // busiest sites first; populate the dropdown once
    D.sites.sort(function (a, b) { return (b.open || 0) - (a.open || 0); });
    var sel = document.getElementById("cda-site");
    sel.innerHTML = D.sites.map(function (x, i) {
      return '<option value="' + i + '">' + esc(x.site) + "  (" + (x.open || 0) + " open / " + (x.total || 0) + ")</option>";
    }).join("");
    document.getElementById("cda-sitecount").textContent = D.sites.length + " audited sites";

    function render() {
      var s = D.sites[active];

      document.getElementById("cda-meta").textContent =
        s.total + " deviations · " + s.open + " open (count against Config Score) · " +
        s.accepted + " accepted · source " + D.source + " · generated " + D.generatedAt;

      // priority rollup
      document.getElementById("cda-prio").innerHTML = D.priorityOrder.map(function (p) {
        var c = s.priority[p] || 0;
        return '<div class="cda-prio cda-prio--' + p + '">' +
          '<div class="cda-prio__count">' + c + "</div>" +
          '<div class="cda-prio__label">' + esc(D.priorityLabel[p] || p) + "</div></div>";
      }).join("");

      // distribution KPIs (exception trail)
      var trail = s.trail || {};
      var kpis = [
        ["HEALTHY", trail.HEALTHY || 0, "success"],
        ["STALE", trail.STALE || 0, "warning"],
        ["ORPHAN", trail.ORPHAN || 0, "warning"],
        ["UNBACKED", trail.UNBACKED || 0, "danger"]
      ];
      document.getElementById("cda-kpis").innerHTML =
        '<div class="kpi"><div class="kpi__value">' + s.open + '</div><div class="kpi__label">Open findings</div></div>' +
        kpis.map(function (k) {
          return '<div class="kpi"><div class="kpi__value">' + k[1] + '</div><div class="kpi__label">Trail · ' + k[0] + "</div></div>";
        }).join("");

      // action groups
      root.innerHTML = s.actions.map(function (a, idx) {
        var samples = (a.samples || []).map(function (d) {
          var io = "";
          if (d.a || d.r) {
            io = '<div class="cda-dev__io">A (site): <b>' + esc(d.a || "∅") + "</b> &nbsp;·&nbsp; R (std): <i>" + esc(d.r || "∅") + "</i></div>";
          }
          return '<div class="cda-dev">' +
            '<div class="cda-dev__key">' + esc(d.section) + " · " + esc(d.element) +
              (d.attr ? " · " + esc(d.attr) : "") + (d.level ? " · " + esc(d.level) : "") +
              '  <span class="chip chip--neutral">' + esc(d.sev) + "</span>" +
              (d.trail ? ' <span class="chip chip--warning">' + esc(d.trail) + "</span>" : "") +
              (d.cfg ? ' <span class="chip chip--success">' + esc(d.cfg) + "</span>" : "") + "</div>" +
            io +
            (d.ai ? '<div class="cda-ai">' + esc(d.ai) + "</div>" : "") +
            (d.explain ? '<div class="cda-explain">' + esc(d.explain) + "</div>" : "") +
            (d.cites ? '<div class="cda-cites">' + tagCites(d.cites) + "</div>" : "") +
            "</div>";
        }).join("");
        return '<div class="cda-action" data-idx="' + idx + '">' +
          '<div class="cda-action__head">' +
            '<span class="cda-pill cda-pill--' + a.priority + '">' + a.priority + "</span>" +
            "<div><div class=\"cda-action__title\">" + esc(a.label) + "</div>" +
            '<div class="cda-action__meaning">' + esc(a.meaning) + "</div></div>" +
            '<span class="cda-action__count">' + a.count + "</span>" +
          "</div>" +
          '<div class="cda-action__body">' + (samples || '<div class="cda-meta">No sample rows.</div>') + "</div>" +
        "</div>";
      }).join("");
    }

    render();

    document.getElementById("cda-site").addEventListener("change", function (e) {
      active = +e.target.value || 0; render();
    });
    root.addEventListener("click", function (e) {
      var h = e.target.closest(".cda-action__head"); if (!h) return;
      h.parentNode.classList.toggle("is-open");
    });
  })();
  </script>
  <script src="./assets/shell.js"></script>
  <script src="./assets/bot.js"></script>
</body>
</html>
